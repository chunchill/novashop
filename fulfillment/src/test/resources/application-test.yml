spring:
  datasource:
    url: jdbc:h2:mem:fulfillment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  main:
    allow-bean-definition-overriding: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

novashop:
  fulfillment:
    warehouse-code: WH-TEST
  messaging:
    order-placed-exchange: novashop.order.placed
    order-placed-queue: fulfillment.order-placed
    order-placed-routing-key: order.placed
