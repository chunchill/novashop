server:
  port: 8084

spring:
  application:
    name: fulfillment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fulfillment}
    username: ${SPRING_DATASOURCE_USERNAME:novashop}
    password: ${SPRING_DATASOURCE_PASSWORD:novashop}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

novashop:
  fulfillment:
    warehouse-code: WH-DEMO-01
  messaging:
    order-placed-exchange: novashop.order.placed
    order-placed-queue: fulfillment.order-placed
    order-placed-routing-key: order.placed

logging:
  level:
    com.novashop.fulfillment: INFO
