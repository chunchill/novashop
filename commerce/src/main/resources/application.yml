server:
  port: 8083

spring:
  application:
    name: commerce
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${SPRING_DATASOURCE_USERNAME:novashop}
    password: ${SPRING_DATASOURCE_PASSWORD:novashop}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

novashop:
  outbox:
    poll-ms: 5000
  messaging:
    order-placed-exchange: novashop.order.placed
    order-placed-routing-key: order.placed

logging:
  level:
    com.novashop.commerce: INFO
